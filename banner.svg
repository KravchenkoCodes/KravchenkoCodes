<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
<title id="t">Andriy Kravchenko</title>
<desc id="d">Blueprint-style banner: Andriy Kravchenko, engineering student at Trinity College Dublin, mechatronics at Formula Trinity. Two meshing gears on the left and a circuit board on the right.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#11407a"/>
    <stop offset="1" stop-color="#0a2a52"/>
  </linearGradient>
  <pattern id="minor" width="10" height="10" patternUnits="userSpaceOnUse">
    <path d="M10 0H0V10" fill="none" stroke="rgba(230,240,255,0.06)" stroke-width="1"/>
  </pattern>
  <pattern id="major" width="50" height="50" patternUnits="userSpaceOnUse">
    <rect width="50" height="50" fill="url(#minor)"/>
    <path d="M50 0H0V50" fill="none" stroke="rgba(230,240,255,0.12)" stroke-width="1"/>
  </pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M0,1 L10,5 L0,9 Z" fill="rgba(230,240,255,0.55)"/>
  </marker>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#7fd4ff" stop-opacity="1"/>
    <stop offset="1" stop-color="#7fd4ff" stop-opacity="0"/>
  </radialGradient>
</defs>
<style>
  text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'Courier New', monospace; }
  .thin { stroke: rgba(230,240,255,0.28); stroke-width: 1; fill: none; }
  .line { stroke: rgba(230,240,255,0.55); stroke-width: 1; fill: none; }
  .zone { fill: rgba(230,240,255,0.28); font-size: 10px; text-anchor: middle; }
  .name { font-size: 60px; font-weight: 700; fill: #e6f0ff; fill-opacity: 0; stroke: #e6f0ff; stroke-width: 1.2;
          stroke-dasharray: 420; stroke-dashoffset: 420;
          animation: draw 2.6s ease-out 0.3s forwards, fillin 0.9s ease-out 2.4s forwards; }
  .sub { font-size: 15px; fill: #e6f0ff; letter-spacing: 3px; opacity: 0; animation: fade 0.8s ease-out forwards; }
  .note { font-size: 11px; fill: rgba(230,240,255,0.55); letter-spacing: 1.5px; }
  .dim { opacity: 0; animation: fade 0.6s ease-out 1.2s forwards; }
  .gear { fill: none; stroke: #e6f0ff; stroke-width: 1.4; }
  .g1 { transform-origin: 150px 150px; animation: spin 18s linear infinite; }
  .g2 { transform-origin: 207.34px 109.85px; animation: spin 10s linear infinite reverse; }
  .trace { fill: none; stroke: rgba(230,240,255,0.55); stroke-width: 1.4; stroke-dasharray: 300; stroke-dashoffset: 300; animation: draw 1.6s ease-out 0.6s forwards; }
  .pad { fill: #0d3566; stroke: #e6f0ff; stroke-width: 1.2; }
  .chip { fill: #0d3566; stroke: #e6f0ff; stroke-width: 1.4; }
  .cell { fill: none; stroke: rgba(230,240,255,0.55); stroke-width: 1; }
  .cellk { font-size: 8px; fill: rgba(230,240,255,0.28); letter-spacing: 1px; }
  .cellv { font-size: 11px; fill: #e6f0ff; letter-spacing: 1px; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fillin { to { fill-opacity: 1; stroke-opacity: 0.35; } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .name { fill-opacity: 1; stroke-dashoffset: 0; stroke-opacity: 0.35; }
    .sub, .dim { opacity: 1; }
    .trace { stroke-dashoffset: 0; }
    .pulse { display: none; }
  }
</style>

<rect width="1200" height="300" fill="url(#bg)"/>
<rect width="1200" height="300" fill="url(#major)"/>

<!-- drawing frame -->
<rect x="8" y="8" width="1184" height="284" class="thin"/>
<rect x="20" y="20" width="1160" height="260" class="line"/>
